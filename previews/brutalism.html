<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>风格预览 · 极简粗野主义</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --ink: #000000;
      --accent: #ff2a00;
      --muted: #666666;
      --light: #e8e8e6;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .screen { width: min(400px, 100%); text-align: center; }
    .badge {
      display: inline-block;
      border: 2px solid var(--ink);
      background: var(--card);
      padding: 5px 14px;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 16px;
      font-weight: 800;
    }
    .card {
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 0;
      padding: 26px;
      box-shadow: 12px 12px 0 var(--ink);
    }
    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: 1px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--ink);
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 22px;
      gap: 16px;
    }
    .head h1 {
      font-size: 28px;
      line-height: 1.0;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .year {
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 2px;
      margin-bottom: 8px;
      font-weight: 800;
    }
    .stamp {
      width: 78px; height: 78px;
      background: var(--accent);
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 900;
      color: #fff;
      flex-shrink: 0;
    }
    .classify {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 22px;
    }
    .classify h2 { font-size: 19px; margin-top: 4px; }
    .classify small { font-size: 9px; color: var(--muted); letter-spacing: 1px; }
    .tag {
      background: var(--ink);
      color: #fff;
      padding: 5px 11px;
      font-size: 10px;
      font-weight: 800;
    }
    .desc {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.65;
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      border-top: 2px solid var(--light);
      border-bottom: 2px solid var(--light);
      padding: 14px 0;
    }
    .risk {
      margin-top: 16px;
      background: var(--light);
      padding: 12px 14px;
      text-align: left;
    }
    .risk b { color: var(--accent); font-size: 11px; }
    .risk p { margin-top: 4px; font-size: 12px; line-height: 1.55; }
    .bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin-top: 16px;
      border: 2px solid var(--ink);
    }
    .bar span {
      padding: 10px 0;
      text-align: center;
      font-size: 15px;
      font-weight: 900;
      border-right: 2px solid var(--ink);
    }
    .bar span:last-child { border-right: none; }
    .bar span.active { background: var(--ink); color: #fff; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="badge">方向 02 · 极简粗野主义</div>
    <div class="card">
      <div class="meta">
        <span>PERSONNEL / DUE DILIGENCE</span>
        <span>档案编号 09-042</span>
      </div>
      <div class="head">
        <div>
          <div class="year">最终背调报告 · 2026</div>
          <h1>社交靠谱度<br>评估结论单</h1>
        </div>
        <div class="stamp">A</div>
      </div>
      <div class="classify">
        <div>
          <small>RESULT CLASSIFICATION</small>
          <h2>A级｜社交清流</h2>
        </div>
        <div class="tag">靠谱珍稀款</div>
      </div>
      <p class="desc">经鉴定，你属于社交圈里罕见的老实人。不画饼，不迂回，不把别人的期待当耗材。跟你相处不用反复复盘，不用偷偷留后路。</p>
      <div class="risk">
        <b>风险备注</b>
        <p>此类人物因过于稀缺，建议社交圈重点保护。</p>
      </div>
      <div class="bar">
        <span class="active">A</span>
        <span>B</span>
        <span>C</span>
        <span>D</span>
      </div>
    </div>
  </div>
</body>
</html>
